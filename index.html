<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTCHO</title>
    <style>
        /* CSS for full-page background image */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        body {
            background-image: url('michael asher2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Grid container styling */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
        }

        /* Grid item styling */
        .grid-item {
            width: 150px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
            filter: drop-shadow(1px 1px 1px #000000);
        }

        .grid-item:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <img src="OTCHO 1 COVER.jpg" alt="OTCHO Issue 1" class="grid-item" onclick="openPDF('OTCHO1.pdf')">
        <img src="OTCHO 2 COVER.jpg" alt="OTCHO Issue 2" class="grid-item" onclick="openPDF('OTCHO2.pdf')">
        <img src="OTCHO3_COVER.png" alt="OTCHO Issue 3" class="grid-item" onclick="openPDF('OTCHO3.pdf')">
        <img src="OTCHO 4 COVER.png" alt="OTCHO Issue 4" class="grid-item" onclick="openPDF('OTCHO4.pdf')">
        <img src="OTCHO 5 COVER.png" alt="OTCHO Issue 5" class="grid-item" onclick="openPDF('OTCHO5.pdf')">
        <img src="OTCHO 6 COVER.png" alt="OTCHO Issue 6" class="grid-item" onclick="openPDF('OTCHO6.pdf')">
    </div>

    <script>
        function openPDF(pdfName) {
            const pdfUrl = pdfName + "#pagemode=none";
            window.open(pdfUrl, '_blank');
        }
    </script>
</body>
</html>
